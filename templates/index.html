<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bank Marketing Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <h1>🏦 Bank Marketing Prediction</h1>

    <p class="subtitle">
        Predict whether a customer will subscribe to a term deposit.
    </p>

    <form action="/predict" method="POST">

        <div class="grid">

            <div class="input-box">
                <label>Age</label>
                <input type="number" name="age" required>
            </div>

            <div class="input-box">
                <label>Job</label>
                <select name="job" required>

                    <option value="admin.">Admin</option>
                    <option value="blue-collar">Blue Collar</option>
                    <option value="entrepreneur">Entrepreneur</option>
                    <option value="housemaid">Housemaid</option>
                    <option value="management">Management</option>
                    <option value="retired">Retired</option>
                    <option value="self-employed">Self Employed</option>
                    <option value="services">Services</option>
                    <option value="student">Student</option>
                    <option value="technician">Technician</option>
                    <option value="unemployed">Unemployed</option>

                </select>
            </div>

            <div class="input-box">
                <label>Marital Status</label>

                <select name="marital">

                    <option value="married">Married</option>
                    <option value="single">Single</option>
                    <option value="divorced">Divorced</option>

                </select>

            </div>

            <div class="input-box">

                <label>Education</label>

                <select name="education">

                    <option value="basic.4y">Basic 4y</option>
                    <option value="basic.6y">Basic 6y</option>
                    <option value="basic.9y">Basic 9y</option>
                    <option value="high.school">High School</option>
                    <option value="illiterate">Illiterate</option>
                    <option value="professional.course">Professional Course</option>
                    <option value="university.degree">University Degree</option>

                </select>

            </div>

            <div class="input-box">

                <label>Default</label>

                <select name="default">

                    <option value="no">No</option>
                    <option value="unknown">Unknown</option>

                </select>

            </div>

            <div class="input-box">

                <label>Housing Loan</label>

                <select name="housing">

                    <option value="yes">Yes</option>
                    <option value="no">No</option>

                </select>

            </div>

            <div class="input-box">

                <label>Personal Loan</label>

                <select name="loan">

                    <option value="yes">Yes</option>
                    <option value="no">No</option>

                </select>

            </div>

            <div class="input-box">

                <label>Contact</label>

                <select name="contact">

                    <option value="cellular">Cellular</option>
                    <option value="telephone">Telephone</option>

                </select>

            </div>

            <div class="input-box">

                <label>Month</label>

                <select name="month">

                    <option value="apr">April</option>
                    <option value="aug">August</option>
                    <option value="dec">December</option>
                    <option value="jul">July</option>
                    <option value="jun">June</option>
                    <option value="mar">March</option>
                    <option value="may">May</option>
                    <option value="nov">November</option>
                    <option value="oct">October</option>
                    <option value="sep">September</option>

                </select>

            </div>

            <div class="input-box">

                <label>Day</label>

                <select name="day_of_week">

                    <option value="mon">Monday</option>
                    <option value="tue">Tuesday</option>
                    <option value="wed">Wednesday</option>
                    <option value="thu">Thursday</option>
                    <option value="fri">Friday</option>

                </select>

            </div>

            <div class="input-box">
                <label>Duration</label>
                <input type="number" name="duration" required>
            </div>

            <div class="input-box">
                <label>Campaign</label>
                <input type="number" name="campaign" required>
            </div>

            <div class="input-box">
                <label>Pdays</label>
                <input type="number" name="pdays" required>
            </div>

            <div class="input-box">
                <label>Previous</label>
                <input type="number" name="previous" required>
            </div>

            <div class="input-box">

                <label>Poutcome</label>

                <select name="poutcome">

                    <option value="failure">Failure</option>
                    <option value="nonexistent">Nonexistent</option>
                    <option value="success">Success</option>

                </select>

            </div>

            <div class="input-box">
                <label>Emp Var Rate</label>
                <input type="number" step="any" name="emp_var_rate" required>
            </div>

            <div class="input-box">
                <label>Cons Price Index</label>
                <input type="number" step="any" name="cons_price_idx" required>
            </div>

            <div class="input-box">
                <label>Cons Conf Index</label>
                <input type="number" step="any" name="cons_conf_idx" required>
            </div>

            <div class="input-box">
                <label>Euribor3m</label>
                <input type="number" step="any" name="euribor3m" required>
            </div>

            <div class="input-box">
                <label>Nr Employed</label>
                <input type="number" step="any" name="nr_employed" required>
            </div>

        </div>

        <button type="submit">Predict</button>

    </form>

    {% if prediction %}

    <div class="result">

        <h2>{{ prediction }}</h2>

        <h3>Confidence : {{ score }}%</h3>

    </div>

    {% endif %}

</div>

</body>
</html>
